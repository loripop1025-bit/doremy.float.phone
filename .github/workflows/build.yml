name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Deploy
        run: |
          curl -sf -X POST https://deploy.loripop.xyz/deploy \
            -H "x-deploy-token: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}"}'
